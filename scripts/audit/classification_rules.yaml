  # Phase 9-bis-physical (T-23) — re-export shims for the relocated
  # v1 lane modules. The actual code lives under
  # market_regions/india/legacy_v1/.
  - path: restx_api/schemas.py
    classification: COMPATIBILITY_SHIM
  - path: restx_api/data_schemas.py
    classification: COMPATIBILITY_SHIM
  - path: restx_api/account_schema.py
    classification: COMPATIBILITY_SHIM
  - path: utils/constants.py
    classification: COMPATIBILITY_SHIM

  # Phase 9-bis-2 final-cleanup (T-35 push) — sys.modules-aliasing
  # shims for the relocated India-only sandbox engine + India-only
  # service implementations + India-only blueprints + India-only
  # database modules. Each shim is a 7-line file that imports the
  # relocated module and replaces sys.modules[__name__] with it,
  # preserving module identity (so module-level singletons stay
  # singleton across both import paths).
  - path: sandbox/__init__.py
