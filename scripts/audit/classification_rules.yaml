# File classification rules for the market-agnostic v3 refactor.
#
# Used by scripts/audit/classify_files.py to assign every Python source
# file to exactly one of:
#
#   PROMOTED_CORE        — must be region/broker neutral
#   LEGACY_INDIA         — India-only, frozen, allowlisted India literals OK
#   REGION_PLUGIN        — under market_regions/* — region facts only
#   BROKER_PLUGIN        — under broker/* — broker facts only
#   COMPATIBILITY_SHIM   — explicit bridges (e.g., domain/translators.py)
#
# Rules are processed in order; first match wins. `path` is an exact
# repo-relative POSIX path. `path_prefix` matches any file under that
# directory.
#
# When a file's actual classification drifts from the rules, the
# classifier exits non-zero and prints the drift. Operator either
# updates this file or the file's location.

# Default classification when no rule matches. LEGACY_INDIA is the
# conservative default: anything not explicitly promoted stays bound
# to the legacy lane and is exempt from the strict literal scanner.
default: LEGACY_INDIA

# Compatibility shims — explicit bridges. Use a dedicated list so
# additions are deliberate.
compatibility_shims:
  - domain/translators.py
  - services/instrument_resolver.py
  - services/venue_session_service.py
  - services/order_router_service.py
  - database/venue_offset.py
  - utils/venue_local_time.py
  # Phase 9-bis-physical (T-23) — re-export shims at the original
  # paths after the v1 lane code physically relocated under
  # market_regions/india/legacy_v1/. Each shim does
  # ``from market_regions.india.legacy_v1.<sub> import *`` so legacy
  # ``from restx_api.schemas import ...`` / ``from utils.constants
  # import ...`` / ``from domain.translators import ...`` continue
  # to resolve without per-callsite changes.
  - restx_api/schemas.py
  - restx_api/data_schemas.py
  - restx_api/account_schema.py
  - utils/constants.py

# Rules processed in order. First match wins.
rules:
  # ---------------- COMPATIBILITY_SHIM ----------------
  - path: domain/translators.py
    classification: COMPATIBILITY_SHIM
  - path: services/instrument_resolver.py
    classification: COMPATIBILITY_SHIM
  - path: services/venue_session_service.py
    classification: COMPATIBILITY_SHIM
  - path: services/order_router_service.py
