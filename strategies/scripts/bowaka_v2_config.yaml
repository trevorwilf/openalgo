# 2026-06-17 - Applied fast_realism 5000-study finalist trial #3437 (combined
#   -0.03170, median_fold -0.05971, holdout +0.05175). PAPER SHADOW: replaces
#   the #3155 config (operator: "not working at all"). 30 tuned keys overlaid
#   (signals/exits/risk/sizing + quote_gate) by scripts/_gen_live_config_from_trial.py;
#   transforms: max_spread_bps->pct, reward_risk->target_pct, signal_fade
#   gaps->cumulative. Live-only blocks preserved (paths, feed=sip, compounding,
#   protected_position, price_chase/halt gates, score, logging, research).
#   environment=paper. CAVEAT: #3437 FAILS the lab robustness gate (worst
#   neighbour -0.127 vs dev -0.060) and was tuned under optimistic fast_realism
#   fills — it is a paper shadow, not a vetted live-promotion candidate.
#   sizing.max_concurrent_positions raised 1 -> 22 (faithful #3437).
#   Backup: strategies/scripts/data/archive/pre_trial3437_20260617/
# ──────────────────────────────────────────────────────────────────
# Bowaka v2 — forming-daily-bar scanner configuration.
#
# Sourced verbatim from handoff §6 ("Recommended v2 configuration")
# at strategies/scripts/documentation/V2/bowaka_v2_quant_engineering_handoff.md
# with the operator-state overrides:
#   strategy.environment: "paper"
#   data.feed: "iex"
#   data.allow_non_sip_for_research_only: true
#   data.live_requires_sip: true          (NEW — Phase 4 startup gate)
#
# WARNING — IEX is partial-tape coverage. Volume aggregates seen on
# IEX are a fraction of consolidated tape volume, which biases
# RVOL_so_far / projected_full_day_rvol / range_expansion DOWN for
# microcaps that route most of their flow elsewhere. The signal
# regime CANNOT be trusted on IEX data; use it only for plumbing
# tests and architecture validation. Switching to consolidated SIP
# data is purely a config flip:
#   data.feed: "sip"
#   data.allow_non_sip_for_research_only: false
# No code change required.
# ──────────────────────────────────────────────────────────────────

# 2026-06-11 - Applied top-N robustness WINNER trial #3155 (combined_score
#   0.43855, dev_net_return_pct mean 0.7826) from the lab
#   walkforward_resolved.yml. Tuned signals/exits/risk/sizing + quote_gate
#   (spread 94bps, exec quote-age 104s applied literally per operator).
#   Live-only blocks preserved (paths, feed=sip, compounding,
#   protected_position, price_chase/halt gates, score, logging, research).
#   Backup: strategies/scripts/data/archive/pre_topn_winner_3155_20260611_072807/
# ------------------------------------------------------------------

strategy:
  name: "BowakaV2"
  strategy_id: "bowaka_v2"
  mode: "forming_daily_bar_monitor"
  environment: "paper"
  analysis_epoch: "bowaka_v2_research_epoch_2026_05_18"

paths:
  universe_snapshot_path: "strategies/scripts/data/bowaka_v2/universe_snapshot.json"
  daily_feature_cache_path: "strategies/scripts/data/bowaka_v2/daily_feature_cache.parquet"
  volume_curve_path: "strategies/scripts/data/bowaka_v2/volume_curve.parquet"
  candidate_events_path: "strategies/scripts/data/bowaka_v2/candidate_events.jsonl"
  entry_decisions_path: "strategies/scripts/data/bowaka_v2/entry_decisions.jsonl"
  state_path: "strategies/scripts/data/bowaka_v2/state.json"
  trade_ledger_path: "strategies/scripts/data/bowaka_v2/trade_ledger.jsonl"
  daily_summary_path: "strategies/scripts/data/bowaka_v2/daily_summary.jsonl"
  log_path: "logs/bowaka_v2_strategy.log"
  kill_switch_dir: "."

data:
  provider: "alpaca"
  feed: "sip"                              # SIP cutover 2026-06-04; consolidated NMS tape
  allow_non_sip_for_research_only: false   # re-armed: SIP entitlement live
  live_requires_sip: true                  # Phase 4 startup gate refuses live unless SIP
  daily_timeframe: "1D"
  intraday_timeframe: "1m"
  timezone: "America/New_York"
  min_history_trading_days: 45
  require_adjusted_daily_bars: true
  require_split_adjustment: true
  fail_on_missing_baseline: true
  max_bar_age_seconds: 90
  max_quote_age_seconds: 15

session:
  timezone: "America/New_York"
  start: "09:30"
  end: "15:55"
  scanner_start: "09:45"
  scanner_end: "15:30"
  loop_interval_seconds: 5

universe:
  allowed_exchanges: ["NASDAQ", "NYSE", "AMEX", "ARCA", "BATS"]
  exclude_otc: true
  exclude_etf: true
  exclude_leveraged_etp: true
  exclude_inverse_etp: true
  exclude_etn: true
  exclude_warrants: true
  exclude_units: true
  exclude_rights: true
  exclude_preferred: true
  ticker_blocklist: ["TSLL", "CONL", "SMCX"]

  price_min: 1.0
  price_max: 20.0
  avg_dollar_volume_min: 250000
  avg_dollar_volume_max:

  market_cap_max:
  float_shares_max:
  shares_outstanding_max:

historical_features:
  lookback_days: 20
  atr_days: 14
  ema_days: 10
  ema_slope_lookback: 3
  volume_curve:
    mode: "adv_bucket"
    bucket_edges: [250000, 500000, 1000000, 5000000, 20000000]
    fallback_opening_15m_share: 0.08
    min_days_for_symbol_curve: 20

scanner:
  enabled: true
  # Diagnostic: dump per-symbol gate-eval results to
  # data/bowaka_v2/scanner_gate_dump.jsonl on every scan. Leave on only
  # while triaging "why is nothing emitting"; the file grows ~1KB per
  # symbol per scan (~38KB per scan tick at 38-symbol universe).
  debug_gate_dump: true
  scan_interval_seconds: 60
  # Concurrent minute-bar prefetch fan-out per scan tick. With the
  # universe cap at 600, conc=40 fetches the whole universe in ~10s
  # (well within the 60s tick). /api/v2/bars is single-symbol and NOT
  # rate-limited by OpenAlgo; the ceiling is the Alpaca paid-tier
  # request budget (~166/s). 40 -> ~74 req/s. Tune up if the local
  # server keeps pace.
  fetch_concurrency: 40
  # Bar source for the per-tick prefetch:
  #   openalgo      — single-symbol /api/v2/bars through the local server
  #                   (simple, but the single-worker server caps ~25-31/s)
  #   alpaca_direct — one multi-symbol request straight to Alpaca's data
  #                   API, bypassing the server (600 names in ~1-2s). Uses
  #                   the same Alpaca creds + ALPACA_DATA_FEED the server
  #                   uses; openalgo is the automatic per-tick fallback.
  # Stays 'openalgo' until the after-close parity diff confirms the two
  # paths return identical bars, then flip to 'alpaca_direct'.
  bar_source: "openalgo"
  alpaca_chunk_size: 200          # symbols per multi-symbol Alpaca request
  alpaca_fetch_concurrency: 4     # concurrent symbol-chunks
  full_universe_refresh_interval_minutes: 5
  in_play_refresh_interval_seconds: 60
  max_candidates_per_scan: 25
  max_entries_per_scan: 3
  signal_expiry_seconds: 600
  same_symbol_entries_per_day: 1
  symbol_cooldown_minutes: 390
  require_prior_daily_baseline: true
  require_fresh_intraday_bar: true

signals:
  rvol_so_far_min: 2.180766810003851             # 2026-06-11: winner #3155 (was 0.65, 2026-06-08 SIP recalibration).
  projected_full_day_rvol_min: 2.958226768828195 # 2026-06-11: winner #3155 set this ABOVE rvol_so_far_min; if the feature engine computes the two identically, this higher floor is the binding RVOL constraint. Was 0.65.
  prior_atr_pct_min: 0.08001509346394585
  range_expansion_so_far_min: 2.3313429453194527  # 2026-06-11: winner #3155 (was 0.60, 2026-06-08 SIP recalibration).
  close_location_so_far_min: 0.6459022368108059
  ema_distance_min: -0.0328508989291792            # 2026-06-11: winner #3155 (was 0.0, SIP 2026-06-04).
  ema_slope_min: -0.012319899344748711            # 2026-06-11: winner #3155 (was -0.05, 2026-06-08).

  # Universe-layer thresholds mirrored here so apply_v2_gates can
  # evaluate them against the candidate's current price / ADV.
  price_min: 1.0
  price_max: 20.0
  avg_dollar_volume_min: 250000
  avg_dollar_volume_max:

  # Blow-off / exhaustion guards. Research priors.
  rvol_so_far_max: 15.063383404911255
  projected_full_day_rvol_max: 4.389998623160714
  range_expansion_so_far_max: 3.435850844675855
  gap_pct_max: 0.38569051045725955
  current_return_pct_max: 0.6809040495280265

score:
  bounded: true
  rvol_score_cap: 5.0
  range_score_cap: 2.5
  ema_distance_score_cap: 0.40
  ema_slope_score_cap: 0.25
  close_location_weight: 0.75
  gap_penalty_above: 0.25

execution:
  parent_order_style: "market"
  marketable_limit_slippage_pct: 0.005
  marketable_limit_timeout_seconds: 30
  bracket_pricing_mode: "actual_fill"
  default_venue_code: "XNAS"

  quote_gate:
    enabled: true
    max_spread_pct: 0.0198
    max_quote_age_seconds: 68
    require_bid_ask_positive: true

  price_chase_gate:
    enabled: true
    max_pct_above_signal_price: 0.10
    min_pct_below_signal_price: -0.03

  halt_gate:
    enabled: true
    block_on_halt_or_pending_review: true
    block_on_recent_luld_pause: true

sizing:
  sizing_mode: "equal_slice"
  bankroll_fixed_dollars: 90000
  max_concurrent_positions: 22
  equal_slice_bankroll_fraction: 0.4871237621044672
  target_risk_dollars: 960.0976463800389
  min_order_notional: 500
  max_per_trade_dollars:

  # Compounding bankroll (2026-06-09). When enabled, the equal-slice
  # sizing bankroll = base + cumulative realized PnL, clamped to
  # [floor_fraction*base, cap_multiple*base]. At/below the floor, ALL new
  # entries are refused (open positions are still managed and exited).
  # Realized profit beyond the cap stays in the account but does not grow
  # sizing. Risk controls (daily_loss_pct, gross/ADV caps) remain anchored
  # to the base, NOT the compounded bankroll, by design.
  compounding:
    enabled: true             # false => fixed bankroll_fixed_dollars sizing (legacy)
    base_dollars:             # null => use bankroll_fixed_dollars (90000) as base
    floor_fraction: 0.50      # effective_equity <= 0.50*base ($45k) => HALT new entries
    cap_multiple: 4.0         # sizing bankroll = min(effective_equity, 4*base) ($360k)

risk:
  daily_loss_pct: 0.02403648309498329
  strategy_slice_loss_pct: 0.025
  max_gross_exposure_pct: 0.713019169077437
  max_total_entries_per_day: 15

  # Multi-lot accumulation. One entry per symbol per day, allowed on
  # consecutive days, capped at this many concurrent lots per symbol.
  # 2026-06-11: winner #3155 sets this to 4 (was 3, previously kept equal
  # to exits.max_hold_days; now decoupled — max_hold_days is 10).
  max_lots_per_symbol: 3

  max_stopouts_per_day: 7
  stop_trading_after_consecutive_stopouts: 7

  adv_tier_caps:
  - max_adv_dollars: 250000
    reject_if_below: true
  - max_adv_dollars: 500000
    max_position_as_adv_frac: 0.003
  - max_adv_dollars: 1000000
    max_position_as_adv_frac: 0.005
  - max_adv_dollars: 5000000
    max_position_as_adv_frac: 0.010
  - max_adv_dollars:
    max_position_as_adv_frac: 0.015

  # Phase 4 shadow risk: stricter mirrors that log "would have
  # blocked" events without actually blocking live entries.
  shadow:
    daily_loss_pct: 0.01
    max_gross_exposure_pct: 0.40
    max_total_entries_per_day: 4
    adv_tier_caps:
    - max_adv_dollars: 250000
      reject_if_below: true
    - max_adv_dollars: 500000
      max_position_as_adv_frac: 0.002
    - max_adv_dollars: 1000000
      max_position_as_adv_frac: 0.003
    - max_adv_dollars: 5000000
      max_position_as_adv_frac: 0.005
    - max_adv_dollars:
      max_position_as_adv_frac: 0.010

exits:
  # 2026-05-26: operator tightened 0.08 -> 0.025. 2026-06-11: reverted to
  # winner #3155 value 0.1038 per operator (supersedes the 2026-05-26 note).
  # Per-lot OCO stop = entry_price * (1 - stop_pct).
  stop_pct: 0.1896328255554003
  target_pct: 0.4464470988
  max_hold_days: 5

  time_stop:
    enabled: true
    exit_time: "15:15"

  signal_fade:
    enabled: true
    initial_mode: "telemetry_then_active_after_validation"
    eval_time: "15:45"
    telemetry_time: "16:05"
    score_thresholds:
      soft: 0.156500767
      hard: 0.3943120795
      critical: 0.4997581073
    exit_on: ["hard", "critical"]
    order_style: "marketable_limit"
    marketable_limit_offset_pct: 0.005

protected_position:
  enabled: true
  max_unprotected_seconds: 10
  max_oco_attach_attempts: 2
  fallback_stop_enabled: true
  flatten_if_unprotected: true
  block_entries_on_violation: true

logging:
  level: "INFO"
  file: "logs/bowaka_v2_strategy.log"
  intraday_tick_interval_seconds: 60
  emit_candidate_events: true
  emit_entry_decisions: true
  emit_rejected_candidates: true
  emit_feature_snapshots: true
  log_order_execution_quality: true
  log_protection_state: true
  log_shadow_risk_controls: true
  log_counterfactual_entries: true
  log_counterfactual_exits: true
  persist_config_snapshot: true

research:
  candidate_minute_bars:
    enabled: true
    output_dir: "strategies/scripts/data/bowaka_v2/candidate_bars"
    layout: "by_session"
    window:
      premarket_start: "08:00"
      session_end: "16:00"
    columns: ["ts", "open", "high", "low", "close", "volume", "vwap", "trade_count"]
    on_missing: "warn"

liquidity_monitor:
  enabled: false
  tick_interval_seconds: 30
  stale_quote_seconds: 30
  severe_stale_quote_seconds: 60
  spread_warning_pct: 0.03
  spread_severe_pct: 0.05
  consecutive_warning_ticks: 3
  action_on_severe_if_profitable: "none"
