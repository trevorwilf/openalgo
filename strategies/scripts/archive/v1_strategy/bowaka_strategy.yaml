# ──────────────────────────────────────────────────────────────────
# Validation regime: numeric defaults in this file reflect the
# Bowaka Consolidated Quant + Engineering Report (May 2026), §7.
# These are paper-validation values, NOT pre-audit production
# values. Reverting any of them must be a documented, deliberate
# operator action — the limits exist because the audit established
# the pre-audit regime had no proven positive expectancy.
# ──────────────────────────────────────────────────────────────────

strategy:
  name: "Bowaka"
  strategy_id: "bowaka"
  # Phase 1.2 — environment partitioning. Valid values are
  # "paper" | "test" | "live". The resolved trade-ledger path is
  # forced under data/<environment>/ so paper and test events can
  # never contaminate each other. The startup gate in main() refuses
  # to run if the environment field disagrees with the resolved
  # ledger path.
  environment: "paper"
  # Phase 1.3 — analysis epoch token, stamped on every ledger event.
  # The post-audit epoch is "bowaka_paper_epoch_2026_05_16_v1"; the
  # archived pre-epoch data lives under data/archive/.
  analysis_epoch: "bowaka_paper_epoch_2026_05_16_v1"

paths:
  candidates_path: "data/in_play_candidates.json"
  state_path: "data/state.json"
  log_path: "logs/bowaka_strategy.log"
  kill_switch_dir: "."
  daily_summary_path: "data/daily_summary.jsonl"

session:
  timezone: "America/New_York"
  start: "09:30"
  end: "15:55"
  signal_fade_eval_time: "16:05"
  loop_interval_seconds: 5

prefilter_handshake:
  expected_config_hash: null   # null = accept any; pin to a value to enforce
  max_age_trading_days: 1
  # Phase 1.3 — fail-closed handshake gates. Null = disabled (legacy
  # behavior, accept any). Pin ``expected_data_feed`` to ``"iex"`` or
  # ``"sip"`` to refuse trading on signals built against the wrong
  # tape (e.g. operator flipped the prefilter YAML to SIP but the
  # candidate file was still IEX-derived). Pin
  # ``expected_schema_version`` to 2 to require the v2 candidate
  # schema; set 1 (or leave null) for legacy candidate files until
  # the prefilter is rerun.
  expected_data_feed: null
  expected_schema_version: 2

broker:
  base_url_env: "HOST_SERVER"
  base_url_default: "http://127.0.0.1:5000"
  timeout_seconds: 15
  poll_interval_seconds: 5
  # Phase 6 (2026-05-16) — optional event-driven order updates.
  # When enabled, an SSE-style stream pushes broker order events
  # into poll_fills' processing loop; the existing polling path
  # remains for reconciliation. Both share the Phase 3 idempotency
  # layer so duplicate events are silently dropped. Ships
  # default-off; operator flips after a smoke run validates the
  # endpoint.
  stream:
    enabled: false
    endpoint: "/api/v2/orders/stream"
    reconnect_initial_backoff_seconds: 1
    reconnect_max_backoff_seconds: 30
    max_consecutive_failures: 5
    lag_warning_seconds: 5
    lag_severe_seconds: 30

sizing:
  per_trade_pct: 0.10
  max_concurrent_positions: 18        # Paper-mode profile (audit §6.3, 2026-05-16); validation defaults archived
  default_venue_code: "XNAS"
  # When true (and bankroll is enabled), each trade is sized to
  # ``bankroll / max_concurrent_positions`` instead of
  # ``per_trade_pct × sizing_basis``. This pairs naturally with
  # bankroll + daily_allocation: each concurrent slot receives an
  # equal share of the bankroll, so a full
  # max_concurrent_positions deployment consumes exactly the
  # bankroll. Concrete example: bankroll=$90,000,
  # max_concurrent_positions=18 → per-trade = $5,000.
  # max_hold_days=3 → ~6 new entries/day × $5,000 = $30,000 daily
  # deployment, matching the daily_allocation slice.
  #
  # When false (legacy), per-trade derives from per_trade_pct ×
  # sizing_basis (which is the daily slice when daily_allocation is
  # enabled, full bankroll otherwise).
  equal_slice_per_position: true
  # Optional scaling for equal_slice mode. The per-trade dollar size
  # becomes ``fraction × bankroll / max_concurrent_positions``.
  #
  # Default ``null`` = AUTO-COUPLE to ``risk.max_gross_exposure_pct``,
  # so the natural max deployment (max_concurrent × per_trade) lands
  # exactly on the gross-exposure cap. Concrete example with
  # bankroll=$90,000, max_concurrent=18, max_gross_exposure_pct=0.80:
  #   per_trade = 0.80 × $90,000 / 18 = $4,000
  #   18 × $4,000 = $72,000 = the gross cap (no idle slots, no cap
  #   surprises). The per-trade size scales with bankroll: a 50%
  #   drawdown to $45k → per_trade = $2,000; growth to $200k →
  #   per_trade = $8,889. Risk discipline travels with the equity
  #   curve.
  #
  # Set an explicit fraction in (0, 1] to override the auto value
  # (useful if you want per-trade *smaller* than the gross cap would
  # imply — e.g., a 0.50 fraction with gross_cap=0.80 leaves a 30%
  # cumulative buffer on top of the per-trade buffer).
  #
  # Paper-mode profile (audit §6.2, 2026-05-16): pin this to 0.80
  # explicitly so relaxing risk.max_gross_exposure_pct does NOT
  # auto-scale per-trade dollars. 0.80 reproduces the $4,000/slot
  # behavior at bankroll=$90k and max_concurrent_positions=18.
  equal_slice_bankroll_fraction: 0.80

  # Phase 6.1 — risk-per-trade sizing mode.
  #   "equal_slice" (default): legacy bankroll/N equal-notional logic.
  #   "risk_per_trade": qty = floor(target_risk_dollars /
  #                           (close * (stop_pct + slip_pct))).
  # target_risk_dollars sets the planned per-trade loss in dollars
  # (Report §7 validation default = $200). max_per_trade_dollars
  # caps total notional regardless of sizing_mode. min_order_notional
  # rejects orders smaller than this to avoid micro-fills.
  sizing_mode: "equal_slice"
  target_risk_dollars: 200
  max_per_trade_dollars: null
  min_order_notional: 500

# Bowaka's working bankroll — the strategy's "envelope" within your
# broker account. All sizing decisions (per_trade_pct, gross_exposure_
# pct) compute against this number, NOT the full account equity. The
# bankroll seeds once, then grows with realized P&L from bowaka's own
# closures and is capped at ``cap_dollars``. Losses also reduce it
# (clamped at $0). The state survives restarts via state.json.
#
# To reset the bankroll to its initial value: change ``reset_token`` to
# any new string and restart. The strategy detects the changed token,
# re-seeds, and records the new token so subsequent reboots don't
# loop-reset.
#
# Disable the bankroll entirely by omitting this whole block — sizing
# reverts to using the full account equity as the basis.
bankroll:
  initial:
    # Exactly one of these must be set; the other must be null.
    pct_of_cash: null        # e.g., 0.10 = 10% of available cash at init
    fixed_dollars: 90000     # e.g., 10000 = seed at exactly $10k
  # Hard ceiling. Realized profits that would push the bankroll above
  # this value are forfeit (the cap stays at cap_dollars). Set to null
  # for unbounded growth.
  cap_dollars: 300000
  # Change this string to force a re-seed at the next launch. The
  # strategy stores the last-seen token and only re-seeds when the
  # YAML's token differs from state's, so leaving it empty after the
  # first run is fine — the bankroll persists across reboots.
  reset_token: "2026-05-11-seed-90k"
  # Slice the bankroll into one allocation per holding day so the
  # strategy always has fresh capital to deploy, even when prior days'
  # positions are still carried. Concrete example: bankroll = $90,000,
  # max_hold_days = 3 → today's per-trade SIZING basis is $30,000
  # (= 90000 / 3), so per_trade_pct=0.10 produces $3,000 per trade.
  # The gross-exposure cap STILL applies to the full $90,000 (not the
  # daily slice), so total carried exposure across all in-flight days
  # is bounded by max_gross_exposure_pct × bankroll. Note that
  # max_concurrent_positions is a total cap on open positions; to keep
  # firing N new entries every day, set max_concurrent_positions ≥
  # N × max_hold_days (e.g., 5 × 3 = 15 to allow 5 new entries each
  # day with 3-day holds).
  daily_allocation:
    enabled: true
    # Override the slice denominator. Null = use cfg.exits.max_hold_days
    # (the natural choice — the slice matches the maximum number of
    # in-flight vintages).
    days: null

risk:
  # Paper-mode profile (audit §6.3, 2026-05-16); validation
  # defaults archived. The relaxation lets the paper run collect
  # more samples (sample size is the binding constraint right now,
  # not capital protection). Per-trade dollars are pinned upstream
  # via sizing.equal_slice_bankroll_fraction so this loosening does
  # not auto-scale individual positions.
  daily_loss_pct: null                # was 0.030 — disabled in paper mode
  max_gross_exposure_pct: 2.00        # was 0.80 — relaxed materially
  max_per_trade_dollars: null         # nullable absolute floor
  max_gross_exposure_dollars: null    # nullable absolute floor
  # Item 3 — capacity cap. Each position is bounded to this fraction
  # of the candidate's avg_dollar_volume. Bowaka's stated edge is
  # capacity-limited, so without this cap a $1M account at 10% per-
  # trade puts $100k into a $250k-ADV name (40% participation, well
  # past where market-impact dominates the trade). 3% is conservative
  # for microcap names. Set to null to disable.
  max_position_as_adv_frac: 0.03
  # Total entries per session (open-tick + post-closure rescreens
  # combined). Bounds runaway chaining if every entry instantly stops
  # out. Without this cap a fast-mean-reverting morning could burn
  # through 10+ trades on stale signals, all paying spread. Null
  # disables the cap (back to "max_concurrent_positions" only).
  max_total_entries_per_day: 25        # Paper-mode profile (audit §6.3, 2026-05-16); validation default archived (was 10)

  # Phase 6.1 — risk-per-trade additions.
  # expected_stop_slippage_pct: extra slippage cushion baked into
  # the per-share loss calc for risk_per_trade sizing. Real fills
  # tend to land worse than the trigger price; 1.5% covers most
  # microcap-stop slippage observed in the audit data.
  expected_stop_slippage_pct: 0.015
  # Tiered ADV participation caps. When this list is non-empty it
  # SUPERSEDES the flat ``max_position_as_adv_frac`` above — that
  # value becomes the fallback used only when this list is empty/
  # missing. Walked top-to-bottom; the first tier whose
  # ``max_adv_dollars`` is >= the candidate's avg_dollar_volume
  # wins. ``max_adv_dollars: null`` is the catch-all top bucket.
  # ``reject_if_below: true`` means the candidate is rejected
  # rather than capped (used for the thinnest tier where any
  # position size would be unrealistic).
  #
  # Boundary semantics: tier matching is INCLUSIVE at the top — a
  # stock with avg_dollar_volume exactly equal to a tier's
  # max_adv_dollars matches that tier, not the next one up. The
  # thinnest tier with reject_if_below: true causes an outright
  # skip rather than a small position. In practice no stock has a
  # precisely round ADV, so this distinction is cosmetic.
  adv_tier_caps:
    - max_adv_dollars: 250000          # below $250k ADV
      reject_if_below: true            # don't trade — too thin to test cleanly
    - max_adv_dollars: 500000          # $250k–$500k ADV
      max_position_as_adv_frac: 0.003    # 0.3% cap
    - max_adv_dollars: 1000000         # $500k–$1M ADV
      max_position_as_adv_frac: 0.005    # 0.5% cap
    - max_adv_dollars: 5000000         # $1M–$5M ADV
      max_position_as_adv_frac: 0.010    # 1.0% cap
    - max_adv_dollars: null            # above $5M ADV
      max_position_as_adv_frac: 0.015    # 1.5% cap

  # Phase 3.4 — circuit breakers. All null = disabled (legacy
  # behavior). Report's recommended validation values are 2 / 2 /
  # 0.010 / 0.025 — pin them in the operator config to activate.
  #   * max_stopouts_per_day: block new entries after N stop_hit
  #     closures today (cumulative; targets do NOT reset the count).
  #   * stop_trading_after_consecutive_stopouts: block new entries
  #     after N stop_hit closures in a row. target_hit / time_stop /
  #     signal_fade / closed_externally reset the streak.
  #   * daily_loss_basis: which equity number drives daily_loss_pct.
  #     "bankroll" (default) reads cfg.bankroll.current_dollars;
  #     "broker_equity" reads the live /api/v2/balances figure;
  #     "daily_slice" reads the per-day slice from get_sizing_basis.
  #   * strategy_slice_loss_pct: when set, in ADDITION to the
  #     legacy daily_loss_pct, the strategy blocks entries once the
  #     day's realized PnL crosses -X% of the daily slice. Tighter
  #     stop than daily_loss_pct because the slice is smaller.
  max_stopouts_per_day: null
  stop_trading_after_consecutive_stopouts: null
  daily_loss_basis: "bankroll"
  strategy_slice_loss_pct: null

entry:
  # Item 4 — bracket pricing mode.
  #   "actual_fill"  : default. Submit the parent MARKET BUY first,
  #                    then attach the OCO take_profit / stop_loss
  #                    bracket once the parent fills. Bracket levels
  #                    derive from filled_avg_price, not yesterday's
  #                    close — this is the only safe mode for gappy
  #                    microcap names.
  #   "candidate_close" : legacy single-shot OTOCO with bracket prices
  #                       computed off the prior close. Preserved for
  #                       backtest parity / debugging only.
  bracket_pricing_mode: "actual_fill"

  # Phase 6.3 — marketable-limit parent entry.
  #   "market" (default): legacy MARKET BUY (slippage uncontrolled).
  #   "marketable_limit": LIMIT BUY at min(ask*(1+slip), close*1.15),
  #                       times out after N seconds if not filled.
  # max_entry_slippage_pct caps the per-order slippage; the optional
  # tiered version overrides per-ADV bucket for thin names.
  # marketable_limit_timeout_seconds cancels the pending LIMIT and
  # frees the slot if the broker hasn't filled by then.
  order_style: "market"
  max_entry_slippage_pct: 0.005
  max_entry_slippage_by_adv_tier: []
  marketable_limit_timeout_seconds: 30

  # Item 9 — intraday confirmation gate (Critical #4 in the review).
  # Bowaka's strongest reconstruction is "daily candidate + live
  # confirmation before entry". Enabled together with the post-closure
  # rescreen below so rescreens never trade on a name whose live price
  # has drifted away from the signal.
  intraday_confirmation:
    enabled: true
    # Phase 4.1 — Report §6 / §7 validation defaults. Wait 15 minutes
    # so opening-range noise has fully settled (was 5).
    window_minutes: 15
    # Tighter spread limit (was 0.02 = 2% of mid). 1% catches the
    # blow-off / wide-spread regime audited as uneconomic.
    max_spread_pct: 0.01
    # Quote must be ≤15 seconds old (was 60). Live trading needs
    # sub-second freshness; 15s is a forgiving cap for paper.
    max_quote_age_seconds: 15
    # Phase 4.2 — stable-quote streak. A candidate must satisfy
    # spread/age/band gates on N successive ``_fetch_quote`` calls
    # before being admitted. Null / 1 = disabled (single-tick check).
    #
    # NOTE on default: the audit prompt's recommended value was 3,
    # but in production ``run_session_entry_pass`` only fires ONCE
    # per session (it gates on ``state.session_date != today_iso``).
    # Combined with Phase 3.1's default of
    # ``post_closure_rescreen.enabled: false``, the streak counter
    # can only ever reach 1 — threshold>1 makes the candidate
    # unreachable. Default ships as 1 until a cross-tick re-fire
    # mechanism is wired (separate follow-up). Operators wanting
    # the multi-tick stability check should also flip the rescreen
    # block on with a permissive ``only_after_reasons`` list, or
    # wait for the dedicated wiring.
    require_stable_quote_checks: 1
    # Live price must sit within this band relative to yesterday's
    # close (the candidate.close):
    #   * max_pct_above_close: cap chase risk — skip names already
    #     up >X% (likely exhausted or about to halt).
    #   * min_pct_below_close: floor on failure — skip names that
    #     gapped down or sold off through the prior close.
    #
    # Phase 4.1: tighter band — Report §6 says 15% gap-up is the
    # outer edge of what's recoverable; bigger gaps tend to fade.
    # min_pct_below_close at -2% rejects names that already broke
    # the prior close (signal is decidedly not in play).
    price_band:
      max_pct_above_close: 0.15
      min_pct_below_close: -0.02
    # Tighter band applied ONLY to post-closure rescreens. At the open
    # tick a 25% gap-up is exactly the trade ("daily candidate + live
    # confirmation"); at 13:00 a name already up 25% from yesterday's
    # close has had four hours for the move to fade or exhaust, so the
    # signal-to-price distance has different statistics. When null,
    # rescreens fall back to ``price_band`` above.
    post_closure_price_band:
      max_pct_above_close: 0.10
      min_pct_below_close: -0.08

    # Phase 4.3 — opening-range / VWAP confirmation. When enabled,
    # build a per-ticker opening-range context (first
    # ``window_minutes`` of session) and require:
    #   - price above VWAP
    #   - price above session open
    #   - price above prior close
    #   - close_location_in_OR_bar >= require_close_location_min
    #   - breakout_mode: either above the OR-high outright, or
    #     ``above_or_near_high`` with tolerance.
    #   - opening_volume_rvol_min: today's OR-window volume vs the
    #     historical OR-window average must clear this multiple.
    #
    # ``enabled: false`` is the safe default. Flip true after
    # operator validates opening-range bars are reliable on the
    # configured feed (IEX may be too thin; SIP recommended).
    opening_range:
      enabled: false
      window_minutes: 15
      require_price_above_vwap: true
      require_price_above_session_open: true
      require_price_above_prior_close: true
      require_close_location_min: 0.60
      breakout_mode: "above_or_near_high"   # above_or_near_high | above_high
      near_high_tolerance_pct: 0.02
      opening_volume_rvol_min: 1.25
      # Phase 4.4 — approximate the historical OR-window volume mean
      # as a fixed fraction of avg_volume (market-microstructure
      # baseline: ~8% of session volume in first 15 min). Replace
      # with a calibrated value once SIP minute-bar history is
      # available.
      opening_volume_session_share: 0.08

  # Re-run the entry pass after any position closes intraday so freed
  # capital and concurrency slots can be redeployed. Carryover-position
  # exits in the morning would otherwise leave the strategy idle for
  # the rest of the session even with full headroom on the gross-
  # exposure cap. Gated by the daily entry cap (risk.max_total_entries
  # _per_day) and the time-of-day cutoff below.
  post_closure_rescreen:
    # Phase 3.1 — DISABLED BY DEFAULT. The audit (Report §C) found
    # post-closure rescreens were responsible for the worst chained
    # losses. Re-enable only after baseline validation establishes
    # the open-tick policy alone has positive expectancy.
    enabled: false
    # No new entries after this ET time. Late-day entries have too
    # little runway before the signal-fade EOD evaluation and the
    # overnight gap, and the post-closure thesis is even thinner past
    # mid-afternoon.
    last_entry_time: "14:00"
    # Phase 3.2 — supported keys for when/if re-enabled. The
    # ``should_set_rescreen_pending`` helper consults these. All
    # null = legacy behavior (every closure sets the flag); any
    # set value tightens the gating. Recommended starting policy
    # (Report §8.4):
    # only_after_reasons: ["target_hit"]
    # max_entries_per_day: 1
    # require_day_pnl_nonnegative: true
    # max_stopouts_today: 1
    only_after_reasons: null
    max_entries_per_day: null
    require_day_pnl_nonnegative: null
    max_stopouts_today: null

exits:
  # Optuna best params (2026-05-17, study=bowaka_production_bt_iex_default,
  # 2500 trials, best_value=2.169562557763738). Pre-optuna values
  # archived in data/archive/pre_optuna_2026_05_17/.
  stop_pct: 0.10434030942439301   # was 0.08
  target_pct: 0.19958025044224442  # was 0.15
  max_hold_days: 2                 # was 3
  # Phase 4.3 (2026-05-16) — hold-thesis signal-fade redesign. The
  # legacy 16:05 MARKET+OPG path is gone; the new design runs a
  # hold-thesis fade score at 15:45 and routes hard/critical bands
  # through an atomic marketable-limit SELL with DAY TIF. The 16:05
  # pass becomes telemetry-only (never submits an order) so the
  # counterfactual study can compare both windows.
  #
  # DISABLED by default after the 2026-05-15 incident. Re-enable
  # only after a counterfactual study (Phase 7) confirms the score
  # thresholds. Telemetry mode at telemetry_time still emits events
  # even when enabled=false, so the counterfactual study has data.
  signal_fade:
    enabled: false
    eval_time: "15:45"        # primary exit-evaluation time
    telemetry_time: "16:05"   # secondary log-only run
    score_thresholds:
      soft: 0.34              # 1-2 of 6 gates fail
      hard: 0.50              # 3 of 6 fail
      critical: 0.67          # 4+ of 6 fail
    exit_on:
      - "hard"
      - "critical"
    order_style: "marketable_limit"
    time_in_force: "DAY"
    marketable_limit_offset_pct: 0.005    # cross 50 bps below bid
    score_weights: null       # null = equal weight
  # Deprecated top-level signal_fade_enabled retained one release
  # for back-compat. Operators on the new schema set this to null.
  signal_fade_enabled: null

  # Phase 5.1 — protected-position invariant. After a parent MARKET
  # BUY fills, the OCO bracket attach has ``max_unprotected_seconds``
  # to confirm. Beyond that the strategy escalates:
  #   1. Retry the OCO attach (up to max_oco_attach_attempts).
  #   2. Submit a stand-alone fallback STOP (or STOP_LIMIT) order.
  #   3. Flatten the position with a MARKET SELL (DAY-TIF) and block
  #      new entries for the session.
  # block_entries_on_violation flags whether step 3 also sets
  # block_new_entries_today (Phase 3 circuit breaker integration).
  protected_position:
    enabled: true
    max_unprotected_seconds: 10
    max_oco_attach_attempts: 2
    fallback_stop_enabled: true
    fallback_stop_order_type: "stop"        # stop | stop_limit
    fallback_stop_limit_offset_pct: 0.02
    flatten_if_unprotected: true
    # Paper-mode profile (audit §6.3, 2026-05-16): log + repair on
    # protection violations but do not throttle new entries — the
    # paper run wants the most samples possible. Shadow controls
    # still report what would-have-been-blocked.
    block_entries_on_violation: false

  # Phase 5.8 — stop-manager scaffolding (DISABLED by default).
  # When enabled, every intraday tick consults
  # ``desired_stop_from_mfe(pos, cfg)``; when the desired stop is
  # higher than the current OCO stop, the existing stop leg is
  # cancelled and a replacement is submitted at the new price.
  # Stops NEVER move down (a lower desired stop is a no-op).
  stop_manager:
    enabled: false
    # When MFE crosses each threshold, the stop is moved to the
    # corresponding break-even / lock-in level. ``mfe_min`` is the
    # minimum unrealized-gain percent (vs entry) for the rule to
    # fire; ``stop_at`` is the percent above entry to place the
    # stop. Phase 5 ships the contract; operator-tuned values live
    # in the operator config.
    rules:
      - {mfe_min: 0.05, stop_at: 0.00}   # at +5% MFE, move stop to break-even
      - {mfe_min: 0.08, stop_at: 0.03}   # at +8%, lock in +3%
      - {mfe_min: 0.12, stop_at: 0.06}   # at +12%, lock in +6%
  # Overnight gap protection. ``GTC`` keeps the OCO take_profit /
  # stop_loss live past 16:00 ET expiry so a position carried
  # overnight doesn't sit naked (saw ~$300+ avoidable slippage on
  # BLDP 2026-05-08 from the previous DAY-TIF behavior). Set to
  # ``DAY`` only for backtest parity with the legacy single-session
  # design.
  oco_time_in_force: "GTC"

# Phase 3 will populate this from the prefilter YAML at strategy start time.
# Duplication is intentional. A regression test (see Phase 3) pins parity
# with the prefilter's compute_features.
signal_gates:
  # Optuna best params (2026-05-17, study=bowaka_production_bt_iex_default,
  # 2500 trials, best_value=2.169562557763738). Pre-optuna values
  # archived in data/archive/pre_optuna_2026_05_17/. These thresholds
  # MUST match the prefilter signals block — verify_prefilter_handshake
  # raises HandshakeMismatch on drift.
  rvol_min: 1.3844422014336542            # was 1.5
  atr_pct_min: 0.03051262989343343        # was 0.06
  range_expansion_min: 1.162515777135367  # was 1.25
  close_location_min: 0.7340130537157081  # was 0.60
  ema_distance_min: 0.08883008785458922   # was 0.0
  ema_slope_min: 0.03594512696636021      # was 0.0

indicators:
  lookback_days: 20
  atr_days: 14
  ema_days: 10
  ema_slope_lookback: 3

logging:
  level: "INFO"
  file: "logs/bowaka_strategy.log"
  # Per-trade rich logs at data/trades/<link_id>.jsonl. Each held
  # position is sampled this often — 60s = standard 1-minute
  # cadence the user wants for offline tuning analysis. Lower the
  # value to densify ticks (e.g. 30s for high-vol regimes); raise
  # it to reduce API load if the broker rate-limits quotes.
  intraday_tick_interval_seconds: 60
  # Paper-mode profile (audit §6.3, 2026-05-16) — research-grade
  # observability. Each switch is read by the code path that emits
  # the corresponding event; with these on a paper run produces a
  # complete decision + counterfactual + execution-quality dataset
  # that downstream analyses can consume directly.
  log_candidate_decisions: true
  log_rejected_candidates: true
  log_counterfactual_entries: true
  log_counterfactual_exits: true
  log_order_execution_quality: true
  log_protection_state: true
  log_config_snapshot: true
  log_shadow_risk_controls: true

# Phase 7.2 (2026-05-16) — minute-bar storage for every prefiltered
# candidate. Used by bowaka_counterfactuals.py to compute alternative
# entry-timing outcomes after the session.
research:
  candidate_minute_bars:
    enabled: true
    output_dir: "data/paper/candidate_bars"
    layout: "by_session"           # one file per session date
    window:
      premarket_start: "08:00"
      session_end: "16:00"
    columns:
      - "ts"
      - "open"
      - "high"
      - "low"
      - "close"
      - "volume"
      - "vwap"
      - "trade_count"
    on_missing: "warn"             # warn | skip | fail

# Phase 7.1 — per-position intraday liquidity monitor. ``enabled:
# false`` default; flip true after operator establishes baseline
# expectations on the configured feed (paper SIP is the recommended
# minimum). Telemetry only in the ``none`` action; ``tighten_stop``
# and ``exit_partial`` are scaffolded as NotImplementedError until a
# follow-up phase wires them.
liquidity_monitor:
  enabled: false
  tick_interval_seconds: 30
  stale_quote_seconds: 30
  severe_stale_quote_seconds: 60
  spread_warning_pct: 0.03
  spread_severe_pct: 0.05
  consecutive_warning_ticks: 3
  action_on_severe_if_profitable: "none"   # none | tighten_stop | exit_partial
