# ──────────────────────────────────────────────────────────────────
# Bowaka v2 — universe builder configuration.
#
# Replaces bowaka_prefilter.yaml. The signals: block is INTENTIONALLY
# absent — signal gates (rvol_so_far, range_expansion, etc.) belong
# to the intraday scanner so it can evaluate the FORMING session bar
# against the universe every minute. The universe layer is a "garbage
# filter" only.
# ──────────────────────────────────────────────────────────────────

strategy:
  name: "BowakaV2UniverseBuilder"
  strategy_id: "bowaka_v2_universe"

paths:
  universe_snapshot_path: "strategies/scripts/data/bowaka_v2/universe_snapshot.json"
  daily_feature_cache_path: "strategies/scripts/data/bowaka_v2/daily_feature_cache.parquet"

data:
  provider: "alpaca"
  feed: "sip"                              # SIP cutover 2026-06-04 (live entitlement)
  daily_timeframe: "1D"
  timezone: "America/New_York"

universe:
  allowed_exchanges: ["NASDAQ", "NYSE", "AMEX", "ARCA", "BATS"]
  exclude_otc: true
  exclude_etf: true
  exclude_leveraged_etp: true
  exclude_inverse_etp: true
  exclude_etn: true
  exclude_warrants: true
  exclude_units: true
  exclude_rights: true
  exclude_preferred: true
  ticker_blocklist: ["TSLL", "CONL", "SMCX"]

  price_min: 1.0
  price_max: 20.0
  avg_dollar_volume_min: 250000
  avg_dollar_volume_max: null
  # Ranks surviving symbols by avg_dollar_volume (descending) and keeps
  # the top N. The scanner prefetches minute bars for every kept symbol
  # concurrently (scanner.fetch_concurrency) each scan_interval_seconds,
  # so a large N still completes well within the tick. Set null = full.
  # 2026-06-11: raised 50 -> 600 (parallel fetch makes the wider net cheap).
  cap_to_n_symbols: 600
  # PRE-fetch sample cap. Randomly samples N of the metadata-eligible
  # symbols BEFORE the daily-bar fetch. 2026-06-11: set null so the
  # builder evaluates the FULL eligible set (~5.8k) and cap_to_n_symbols
  # selects the genuine top-600 by ADV (not a random subset's top-600).
  # The concurrent daily-bar prefetch (live_fetch.fetch_concurrency)
  # keeps a full build to ~tens of seconds. Set an int to re-bound.
  pre_fetch_sample_n: null
  pre_fetch_sample_seed: 42

# Live fetch settings — apply only when --dry-run is NOT set.
live_fetch:
  # OpenAlgo /api/v2 endpoint. The universe builder reuses the same
  # HOST_SERVER + OPENALGO_API_KEY env vars the v1 strategy used.
  host_server_env: HOST_SERVER
  api_key_env: OPENALGO_API_KEY
  daily_bars_lookback_calendar_days: 45
  # Concurrent daily-bar prefetch fan-out. /api/v2/bars is single-symbol
  # and NOT rate-limited by OpenAlgo, so this is bounded only by the data
  # provider's request budget (Alpaca paid tier ~166/s). 40 -> ~74 req/s.
  fetch_concurrency: 40
  # Cache file at strategies/scripts/data/universe_us_equity.json
  # is used as the asset list. The v1 prefilter built it from
  # Alpaca direct; reusing it avoids needing alpaca-py credentials.
  asset_list_cache: "strategies/scripts/data/universe_us_equity.json"

historical_features:
  lookback_days: 20
  atr_days: 14
  ema_days: 10
  ema_slope_lookback: 3

# Instrument-class name-keyword matchers (mirror v1 prefilter).
instrument_rules:
  ticker_blocklist: []                      # additive to universe.ticker_blocklist
  name_keywords:
    leveraged: ["1.5X", "2X", "3X", "BULL", "BEAR", "ULTRA", "DAILY"]
    inverse:   ["INVERSE", "SHORT", "BEAR"]
    etn:       [" ETN ", "NOTES", "EXCHANGE TRADED NOTE"]
    warrant:   ["WARRANT", " W ", " WS "]
    unit:      ["UNIT", " UT "]
    right:     ["RIGHT", " R "]
    preferred: ["PREFERRED", " PR ", " PFD "]
    etf:       ["ETF", "INDEX FUND", "TRUST"]

logging:
  level: "INFO"
  file: "logs/bowaka_v2_universe_builder.log"
